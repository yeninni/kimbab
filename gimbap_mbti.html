    justify-content: center;
    padding: 2rem 1rem 3rem;
    position: relative;
    overflow-x: hidden;
  }
  body::before,

    content: '';
    position: fixed;
    width: 180px;
    height: 180px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.45);
    filter: blur(8px);
    z-index: 0;
    pointer-events: none;
  }

  body::after { right: -30px; bottom: 88px; }
  .wrap {
    max-width: 560px;
    width: 100%;
    position: relative;
    z-index: 1;
  }
  .screen { display: none; }
  .screen.active {
    display: block;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.95);
    border-radius: 32px;
    padding: 1.8rem;
    box-shadow: var(--shadow);

    position: relative;
    overflow: hidden;

    background:

    color: #4b8f75;

    height: 86px;

  .result-type {

    font-weight: 800;
    color: #348368;
    background: linear-gradient(180deg, #effcf5, #e0f6ec);
    display: inline-block;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    letter-spacing: 0.06em;
    border: 1px solid #d6f0e4;

  .result-traits { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1.25rem; }
  .trait {

    padding: 0.45rem 0.75rem;
    border-radius: 999px;
    background: #fff4ec;
    color: #946856;
    border: 1px solid #ffdccc;

  .result-activity {

    padding-top: 1rem;

  .result-activity strong { color: var(--primary-deep); }
  .btn-row { display: flex; gap: 8px; margin-top: 1.25rem; }
  .copy-btn { flex: 1; font-size: 0.92rem; }
  .retry-btn {
    background: #fff;
    border: 1.5px solid #ffd8c6;
    border-radius: 18px;

    font-size: 0.92rem;

    color: #8e675a;

    font-weight: 700;

  .retry-btn:hover {

    border-color: #ffb999;
    background: #fff8f4;
  }
  .share-label { font-size: 12px; color: #b58f80; margin-bottom: 8px; font-weight: 700; }
  .footer-note { font-size: 12px; color: #c1a69a; text-align: center; margin-top: 1.5rem; }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 640px) {
    body { padding: 1rem 0.8rem 2rem; }
    .screen.active { border-radius: 24px; padding: 1.3rem; }
    .intro-title { font-size: 2rem; }
    .q-text { font-size: 1.2rem; min-height: 3.5rem; }
    .btn-row { flex-direction: column; }
    .result-emoji { width: 76px; height: 76px; font-size: 3.4rem; }
  }
</style>
</head>

  ISTJ: { name: "기본 야채 김밥", emoji: "🥗", desc: "묵묵히 제 역할을 다하는 신뢰의 상징. 화려하진 않지만 언제나 옳은 선택입니다.", traits: ["성실함", "신중함", "꼼꼼함", "책임감"], activity: "김밥 완성도 평가단" },
  ISTP: { name: "김치 참치 김밥", emoji: "🌿", desc: "독립적이고 실용적. 겉은 심플해 보이지만 속은 복잡하고 깊은 맛을 지닌 현실주의자.", traits: ["독립적", "실용적", "과묵함", "분석적"], activity: "김밥 재료 분류 및 조합 실험" },
  ISFJ: { name: "오이 당근 김밥", emoji: "🥕", desc: "섬세하고 배려 깊은 조용한 지지자. 건강하고 균형 잡힌 삶을 사랑하는 성실파.", traits: ["배려", "섬세함", "성실함", "안정적"], activity: "어린이 김밥 만들기 도우미" },
  ISFP: { name: "화이트 참치 김밥", emoji: "🤍", desc: "조용하지만 감각적. 자신만의 뚜렷한 미감을 가진 예술가형 인간입니다.", traits: ["감각적", "자유로운 영혼", "예술적", "섬세함"], activity: "김밥 비주얼 플레이팅 체험" },
  INTJ: { name: "흑미 현미 김밥", emoji: "🖤", desc: "남다른 신념과 비전을 가진 전략가. 겉은 담백하지만 내면은 깊고 독창적입니다.", traits: ["전략적", "독창적", "완벽주의", "비전"], activity: "김밥 축제 기획 아이디어 제안" },
  INTP: { name: "두부 견과류 김밥", emoji: "🧠", desc: "예상치 못한 재료의 조합처럼, 독자적인 사고방식으로 새로운 가능성을 탐구하는 분석가.", traits: ["분석적", "탐구적", "독창적", "논리적"], activity: "김밥 성분 분석 & 레시피 연구" },
  INFJ: { name: "나물 도토리 김밥", emoji: "🌱", desc: "깊은 내면과 강한 신념을 가진 희귀한 존재. 의미 있는 것에만 마음을 여는 이상주의자.", traits: ["통찰력", "이상주의", "진정성", "섬세함"], activity: "지역 식재료 스토리텔링 참여" },
  INFP: { name: "단호박 고구마 김밥", emoji: "🍠", desc: "달콤하고 포근한 감성파. 자신만의 세계관이 뚜렷하고, 진심 어린 관계를 소중히 여깁니다.", traits: ["감성적", "공감력", "창의적", "진정성"], activity: "김밥 스토리 포토 부스" }
};

let scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
let current = 0;

function startTest() {
  document.getElementById('intro').classList.remove('active');
  document.getElementById('quiz').classList.add('active');
  showQ();
}

function showQ() {
  const q = questions[current];
  document.getElementById('q-num').textContent = `${current+1} / ${questions.length}`;
  document.getElementById('q-pct').textContent = `${Math.round((current/questions.length)*100)}%`;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog').style.width = `${(current/questions.length)*100}%`;
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  q.opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = o.text;
    btn.onclick = () => answer(o.dim);
    opts.appendChild(btn);
  });
}

function answer(dim) {
  scores[dim]++;
  current++;
  if (current < questions.length) {
    showQ();
  } else {
    showResult();
  }
}

function showResult() {
  const mbti =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');
  const r = types[mbti];
  document.getElementById('res-emoji').textContent = r.emoji;
  document.getElementById('res-mbti').textContent = mbti;
  document.getElementById('res-name').textContent = r.name;
  document.getElementById('res-desc').textContent = r.desc;
  document.getElementById('res-activity').textContent = r.activity;
  const traitsEl = document.getElementById('res-traits');
  traitsEl.innerHTML = r.traits.map(t => `<span class="trait">${t}</span>`).join('');
  document.getElementById('quiz').classList.remove('active');
  document.getElementById('result').classList.add('active');
}

function copyResult() {
  const mbti = document.getElementById('res-mbti').textContent;
  const name = document.getElementById('res-name').textContent;
  const text = `나의 김밥 MBTI는 ${mbti} — ${name}!\n2026 김천김밥축제에서 나만의 김밥을 찾아보세요 🍱`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '복사 완료!';
    setTimeout(() => btn.textContent = '결과 복사하기', 2000);
  });
}

function resetTest() {
  scores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
  current = 0;
  document.getElementById('result').classList.remove('active');
  document.getElementById('intro').classList.add('active');
}
</script>
